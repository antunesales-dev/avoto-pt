# Desenvolvimento: branch dev → GitHub Pages
# URL: https://antunesales-dev.github.io/avoto-pt/
name: Deploy dev (GitHub Pages)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev-gh-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem "version": usa package.json "packageManager" (evita ERR Multiple versions of pnpm)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SPA (não PWA): no GH Pages o service worker cacheava index.html antigo
      # (CSP inline + chunks 404). PWA fica para Cloudflare prod.
      - name: Build (dev / GitHub Pages SPA)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          PUBLIC_PATH: /avoto-pt/
        run: pnpm build:spa

      # History mode: qualquer rota (ex. /investimentos) serve o index via 404.html
      - name: SPA 404 fallback
        run: |
          OUT=dist/spa
          test -d "$OUT" || { echo "missing $OUT"; exit 1; }
          cp "$OUT/index.html" "$OUT/404.html"
          test -f "$OUT/sw-cleanup.js" || echo "warn: no sw-cleanup.js"
          # Cache-bust hint no 404 (mesmo conteúdo que index)
          echo "out=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.out || 'dist/spa' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
