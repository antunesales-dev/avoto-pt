# Desenvolvimento: branch dev → GitHub Pages
# URL: https://antunesales-dev.github.io/avoto-pt/
name: Deploy dev (GitHub Pages)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev-gh-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem "version": usa package.json "packageManager" (evita ERR Multiple versions of pnpm)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (dev / GitHub Pages)
        env:
          # Opcional: criar secrets VITE_SUPABASE_*_DEV para um projecto Supabase de staging
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          PUBLIC_PATH: /avoto-pt/
        run: pnpm build

      # SPA history mode no GitHub Pages: 404.html = index.html
      - name: SPA 404 fallback
        run: |
          OUT=dist/pwa
          if [ ! -d "$OUT" ]; then OUT=dist/spa; fi
          cp "$OUT/index.html" "$OUT/404.html"
          echo "out=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.out || 'dist/pwa' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
