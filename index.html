<!doctype html>
<html lang="pt-PT">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=yes, initial-scale=1, maximum-scale=5, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">
    <meta name="theme-color" content="#046a38">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; frame-src https://challenges.cloudflare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com<% if (ctx.dev) { %> ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*<% } %>; worker-src 'self' blob:;"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
  </head>
  <body>
    <!-- Unregister SW legados no GitHub Pages (evita 404 de chunks com hash antigo) -->
    <script>
      (function () {
        try {
          var h = location.hostname || ''
          if (!h.endsWith('github.io') && h !== 'localhost' && h !== '127.0.0.1') return
          if (!('serviceWorker' in navigator)) return
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (!regs.length) return
            return Promise.all(regs.map(function (r) { return r.unregister() })).then(function () {
              if (window.caches) {
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                })
              }
            }).then(function () {
              try {
                if (sessionStorage.getItem('avoto-sw-nuked') === '1') return
                sessionStorage.setItem('avoto-sw-nuked', '1')
              } catch (e) {}
              location.reload()
            })
          })
        } catch (e) {}
      })()
    </script>
    <!-- quasar:entry-point -->
  </body>
</html>
